name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify project layout
        run: |
          test -f package.json
          test -f next.config.mjs
          test -f prisma/schema.prisma
          test -f README.md
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'))"
