name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Vitest
        run: npm test

      - name: Next build
        run: npm run build
        env:
          # Provide stub values so env-validation passes at build time without
          # a real database or OAuth app. These are not used at runtime.
          GITHUB_CLIENT_ID: ci-stub
          GITHUB_CLIENT_SECRET: ci-stub
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-stub-secret-value-32-chars-long!!
          TOKEN_ENCRYPTION_KEY: ci-stub-encryption-key-32-chars!!
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          GITHUB_MAINTAINER_ORG: ci-org
